<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chintan Goyal</title>
  <desc id="desc">Data &amp; AI Infrastructure — constellation hero</desc>

  <defs>
    <!-- Node gradient: teal → indigo -->
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Subtle glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="300" fill="#0d1117"/>

  <!-- ======================== -->
  <!-- RIGHT ZONE: Constellation -->
  <!-- ======================== -->

  <!-- Connection lines (14 total) -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <!-- 1-2 --><line x1="590" y1="65" x2="700" y2="40"/>
    <!-- 1-4 --><line x1="590" y1="65" x2="640" y2="145"/>
    <!-- 2-3 --><line x1="700" y1="40" x2="800" y2="70"/>
    <!-- 2-5 --><line x1="700" y1="40" x2="750" y2="130"/>
    <!-- 3-5 --><line x1="800" y1="70" x2="750" y2="130"/>
    <!-- 3-6 --><line x1="800" y1="70" x2="830" y2="170"/>
    <!-- 4-5 --><line x1="640" y1="145" x2="750" y2="130"/>
    <!-- 4-7 --><line x1="640" y1="145" x2="570" y2="230"/>
    <!-- 4-8 --><line x1="640" y1="145" x2="690" y2="220"/>
    <!-- 5-6 --><line x1="750" y1="130" x2="830" y2="170"/>
    <!-- 5-8 --><line x1="750" y1="130" x2="690" y2="220"/>
    <!-- 7-8 --><line x1="570" y1="230" x2="690" y2="220"/>
    <!-- 8-9 --><line x1="690" y1="220" x2="790" y2="255"/>
    <!-- 6-9 --><line x1="830" y1="170" x2="790" y2="255"/>
  </g>

  <!-- Nodes (9 total) with independent pulse animations -->
  <!-- Node 1: (590,65) r=7 -->
  <circle cx="590" cy="65" r="7" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.0s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 2: (700,40) r=5 -->
  <circle cx="700" cy="40" r="5" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 3: (800,70) r=8 -->
  <circle cx="800" cy="70" r="8" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.8s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 4: (640,145) r=9 — hub -->
  <circle cx="640" cy="145" r="9" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.0s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 5: (750,130) r=6 -->
  <circle cx="750" cy="130" r="6" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 6: (830,170) r=7 -->
  <circle cx="830" cy="170" r="7" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 7: (570,230) r=5 -->
  <circle cx="570" cy="230" r="5" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="3.8s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 8: (690,220) r=7 -->
  <circle cx="690" cy="220" r="7" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Node 9: (790,255) r=4 -->
  <circle cx="790" cy="255" r="4" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.7s" repeatCount="indefinite"/>
  </circle>

  <!-- Signal dot A: path 1→4→5→6→9, 8s cycle -->
  <circle r="2.5" fill="#38bdf8" opacity="0.9">
    <animateMotion dur="8s" repeatCount="indefinite"
      path="M590,65 L640,145 L750,130 L830,170 L790,255"/>
  </circle>

  <!-- Signal dot B: path 2→1→4→7→8, 10s cycle, begin 3s -->
  <circle r="2.5" fill="#818cf8" opacity="0.9">
    <animateMotion dur="10s" repeatCount="indefinite" begin="3s"
      path="M700,40 L590,65 L640,145 L570,230 L690,220"/>
  </circle>

  <!-- ======================== -->
  <!-- LEFT ZONE: Text content  -->
  <!-- ======================== -->

  <!-- Name -->
  <text x="50" y="85" fill="#f0f0f0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="600" opacity="0">
    Chintan Goyal
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="50" y="115" fill="#8b949e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" opacity="0">
    Data &amp; AI Infrastructure
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Metric pills -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>

    <!-- Pill 1: ~550 PB -->
    <rect x="50" y="155" width="78" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="89" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">~550 PB</text>

    <!-- Pill 2: ~15M users -->
    <rect x="138" y="155" width="92" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="184" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">~15M users</text>

    <!-- Pill 3: p95 ~30s -->
    <rect x="240" y="155" width="82" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="281" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">p95 ~30s</text>

    <!-- Pill 4: ~$10M saved -->
    <rect x="332" y="155" width="98" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="381" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">~$10M saved</text>
  </g>

  <!-- Descriptor line -->
  <text x="50" y="210" fill="#484f58" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="400" opacity="0">
    multi-cloud · telecom · fintech · analytics
    <animate attributeName="opacity" from="0" to="0.8" dur="0.6s" begin="0.7s" fill="freeze"/>
  </text>

</svg>
