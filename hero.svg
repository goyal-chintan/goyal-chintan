<svg width="880" height="250" viewBox="0 0 880 250" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chintan Goyal</title>
  <desc id="desc">Data and AI infrastructure engineer</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="880" y2="250">
      <stop offset="0" stop-color="#0b0d17"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1">
        <animate attributeName="stop-color" values="#6366f1;#8b5cf6;#6366f1" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#8b5cf6">
        <animate attributeName="stop-color" values="#8b5cf6;#6366f1;#8b5cf6" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="subtleLine" x1="0" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6366f1" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="880" height="250" fill="url(#bg)"/>

  <!-- Single subtle horizontal line -->
  <line x1="0" y1="165" x2="880" y2="165" stroke="url(#subtleLine)" stroke-width="0.5"/>

  <!-- Name -->
  <text x="48" y="72" fill="#f8fafc" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">Chintan Goyal</text>

  <!-- Role line -->
  <text x="50" y="104" fill="#94a3b8" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="18" font-weight="400">Data &amp; AI infrastructure · multi-cloud platforms · systems architecture</text>

  <!-- Accent bar (only animation that matters) -->
  <rect x="48" y="118" width="0" height="2.5" rx="1.25" fill="url(#accent)">
    <animate attributeName="width" from="0" to="100" dur="1.2s" fill="freeze"/>
  </rect>

  <!-- Metric pills - readable size -->
  <g>
    <rect x="48" y="138" width="100" height="22" rx="11" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="98" y="153" text-anchor="middle" fill="#a5b4fc" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="11" font-weight="500">~15M users</text>
  </g>
  <g>
    <rect x="160" y="138" width="82" height="22" rx="11" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="201" y="153" text-anchor="middle" fill="#a5b4fc" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="11" font-weight="500">~50 PB</text>
  </g>
  <g>
    <rect x="254" y="138" width="96" height="22" rx="11" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="302" y="153" text-anchor="middle" fill="#a5b4fc" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="11" font-weight="500">p95 ~30s</text>
  </g>
  <g>
    <rect x="362" y="138" width="130" height="22" rx="11" fill="#1e1b4b" fill-opacity="0.5" stroke="#6366f1" stroke-opacity="0.2" stroke-width="0.5"/>
    <text x="427" y="153" text-anchor="middle" fill="#a5b4fc" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="11" font-weight="500">~$100k/mo saved</text>
  </g>

  <!-- Bottom section: what I'm building -->
  <text x="48" y="196" fill="#64748b" font-family="'SF Mono','Fira Code','JetBrains Mono',monospace" font-size="11" font-weight="500" letter-spacing="1">NOW</text>
  <text x="48" y="220" fill="#cbd5e1" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="15" font-weight="500">Project Lumos</text>
  <text x="180" y="220" fill="#475569" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="15" font-weight="400">metadata automation</text>
  <text x="390" y="220" fill="#334155" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="15">·</text>
  <text x="414" y="220" fill="#cbd5e1" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="15" font-weight="500">OpsPilot</text>
  <text x="504" y="220" fill="#475569" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="15" font-weight="400">eval-gated LLM ops</text>

  <!-- Tagline -->
  <text x="48" y="244" fill="#334155" font-family="'Inter','SF Pro Display',-apple-system,system-ui,sans-serif" font-size="12" font-weight="400">Boring, reliable systems that earn their complexity.</text>

</svg>
