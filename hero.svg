<svg width="880" height="300" viewBox="0 0 880 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Chintan Goyal</title>
  <desc id="desc">Data &amp; AI Infrastructure — system topology constellation</desc>

  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="nodeGradWarm" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowStrong" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="880" height="300" fill="#0d1117"/>

  <!-- ======================================== -->
  <!-- RIGHT ZONE: System Topology Constellation -->
  <!-- ======================================== -->
  <!-- Radial layout centered on "transform" hub -->
  <!-- Nodes: source, ingest, ML, transform(hub), cache, store, orchestrate, serve, observe, edge, alert -->

  <!-- Connection lines — organic curves via quadratic bezier -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1" fill="none">
    <!-- source → ingest -->
    <path d="M525,42 Q570,50 615,68"/>
    <!-- ingest → transform -->
    <path d="M615,68 Q665,85 715,118"/>
    <!-- ingest → ML -->
    <path d="M615,68 Q650,42 695,32"/>
    <!-- ML → transform -->
    <path d="M695,32 Q710,70 715,118"/>
    <!-- transform → store -->
    <path d="M715,118 Q775,120 830,135"/>
    <!-- transform → serve -->
    <path d="M715,118 Q700,165 695,215"/>
    <!-- transform → orchestrate -->
    <path d="M715,118 Q645,145 578,185"/>
    <!-- transform → cache -->
    <path d="M715,118 Q760,80 805,52"/>
    <!-- store → cache -->
    <path d="M830,135 Q820,90 805,52"/>
    <!-- store → observe -->
    <path d="M830,135 Q828,175 815,222"/>
    <!-- serve → observe -->
    <path d="M695,215 Q755,222 815,222"/>
    <!-- observe → alert -->
    <path d="M815,222 Q840,205 862,188"/>
    <!-- orchestrate → edge -->
    <path d="M578,185 Q555,210 532,245"/>
    <!-- ingest → orchestrate -->
    <path d="M615,68 Q590,125 578,185"/>
    <!-- ML → serve (long arc) -->
    <path d="M695,32 Q660,125 695,215"/>
  </g>

  <!-- Hub ring — pulsing outer ring on transform node -->
  <circle cx="715" cy="118" r="18" fill="none" stroke="url(#nodeGrad)" stroke-width="0.5" opacity="0.15">
    <animate attributeName="r" values="18;22;18" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.15;0.05;0.15" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Nodes — sized by importance, colored by function -->

  <!-- source (525,42) r=3 — tiny outlier, data origin -->
  <circle cx="525" cy="42" r="3" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- ingest (615,68) r=6 -->
  <circle cx="615" cy="68" r="6" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3.2s" repeatCount="indefinite"/>
  </circle>

  <!-- ML (695,32) r=5 — floats above the hub -->
  <circle cx="695" cy="32" r="5" fill="url(#nodeGradWarm)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.85;0.4" dur="3.8s" repeatCount="indefinite"/>
  </circle>

  <!-- transform (715,118) r=11 — HUB, largest node -->
  <circle cx="715" cy="118" r="11" fill="url(#nodeGrad)" filter="url(#glowStrong)">
    <animate attributeName="opacity" values="0.65;1;0.65" dur="4.2s" repeatCount="indefinite"/>
  </circle>

  <!-- cache (805,52) r=3.5 — tiny, performance -->
  <circle cx="805" cy="52" r="3.5" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.65;0.3" dur="2.8s" repeatCount="indefinite"/>
  </circle>

  <!-- store (830,135) r=8 — large, persistence -->
  <circle cx="830" cy="135" r="8" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.55;0.95;0.55" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- orchestrate (578,185) r=4.5 — small, workflow -->
  <circle cx="578" cy="185" r="4.5" fill="url(#nodeGradWarm)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.35;0.75;0.35" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- serve (695,215) r=6 — medium, delivery -->
  <circle cx="695" cy="215" r="6" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.9;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- observe (815,222) r=5 — medium, monitoring -->
  <circle cx="815" cy="222" r="5" fill="url(#nodeGradWarm)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.8;0.4" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- edge (532,245) r=3 — tiny outlier, IoT -->
  <circle cx="532" cy="245" r="3" fill="url(#nodeGrad)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.25;0.55;0.25" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- alert (862,188) r=3 — tiny outlier, alerting -->
  <circle cx="862" cy="188" r="3" fill="url(#nodeGradWarm)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;0.6;0.3" dur="3.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Node labels — very faint, only on key nodes -->
  <g font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="8" fill="rgba(255,255,255,0.12)" font-weight="400">
    <text x="615" y="58">ingest</text>
    <text x="695" y="23">ML</text>
    <text x="730" y="115">transform</text>
    <text x="840" y="132">store</text>
    <text x="695" y="233">serve</text>
    <text x="815" y="238">observe</text>
  </g>

  <!-- Signal dot A: data pipeline — source→ingest→transform→store→observe→alert (10s) -->
  <circle cx="525" cy="42" r="2.5" fill="#38bdf8" opacity="0">
    <animateMotion dur="10s" repeatCount="indefinite"
      path="M525,42 Q570,50 615,68 Q665,85 715,118 Q775,120 830,135 Q828,175 815,222 Q840,205 862,188"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0.9;0.9;0" dur="10s" repeatCount="indefinite"/>
  </circle>

  <!-- Signal dot B: ML inference — ingest→ML→serve→observe (12s, begin 4s) -->
  <circle cx="615" cy="68" r="2" fill="#a78bfa" opacity="0">
    <animateMotion dur="12s" repeatCount="indefinite" begin="4s"
      path="M615,68 Q650,42 695,32 Q660,125 695,215 Q755,222 815,222"/>
    <animate attributeName="opacity" values="0;0.7;0.7;0.7;0" dur="12s" repeatCount="indefinite" begin="4s"/>
  </circle>

  <!-- Signal dot C: edge processing — transform→orchestrate→edge (8s, begin 2s) -->
  <circle cx="715" cy="118" r="1.5" fill="#818cf8" opacity="0">
    <animateMotion dur="8s" repeatCount="indefinite" begin="2s"
      path="M715,118 Q645,145 578,185 Q555,210 532,245"/>
    <animate attributeName="opacity" values="0;0.6;0.6;0.6;0" dur="8s" repeatCount="indefinite" begin="2s"/>
  </circle>

  <!-- ======================== -->
  <!-- LEFT ZONE: Text content  -->
  <!-- ======================== -->

  <!-- Name -->
  <text x="50" y="85" fill="#f0f0f0" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="40" font-weight="600" opacity="0">
    Chintan Goyal
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="50" y="115" fill="#8b949e" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="16" font-weight="400" opacity="0">
    Data &amp; AI Infrastructure
    <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.2s" fill="freeze"/>
  </text>

  <!-- Metric pills -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.5s" fill="freeze"/>

    <!-- Pill 1: ~550 PB -->
    <rect x="50" y="155" width="78" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="89" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">~550 PB</text>

    <!-- Pill 2: ~15M users -->
    <rect x="138" y="155" width="92" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="184" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">~15M users</text>

    <!-- Pill 3: p95 ~30s -->
    <rect x="240" y="155" width="82" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="281" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">p95 ~30s</text>

    <!-- Pill 4: ~$10M saved -->
    <rect x="332" y="155" width="98" height="26" rx="13"
      fill="rgba(56,189,248,0.08)" stroke="rgba(56,189,248,0.25)" stroke-width="1"/>
    <text x="381" y="173" text-anchor="middle" fill="#8b949e"
      font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="12" font-weight="500">~$10M saved</text>
  </g>

  <!-- Descriptor line -->
  <text x="50" y="210" fill="#484f58" font-family="system-ui,-apple-system,'Segoe UI',sans-serif" font-size="13" font-weight="400" opacity="0">
    multi-cloud · telecom · fintech · analytics
    <animate attributeName="opacity" from="0" to="0.8" dur="0.6s" begin="0.7s" fill="freeze"/>
  </text>

</svg>
